# Runs the end-to-end smoke test (tests/smoke.js) on every pull request and on main.
name: Test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --prefix tests playwright@1.63.0
      - run: npx --prefix tests playwright install --with-deps chromium
      - run: NODE_PATH=tests/node_modules node tests/smoke.js
