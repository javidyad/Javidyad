<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Javidnam list</title>
<meta name="description" content="Choose a Javidnam and make a memorial poster with their photo and name.">
<meta property="og:title" content="Javidnam list">
<meta property="og:type" content="website">
<meta property="og:url" content="https://javidyad.com/javidnam.html">
<meta property="og:image" content="https://javidyad.com/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="Lion_and_Sun.png">
<meta name="theme-color" content="#1b2a4a">
<style>
  /* Same fonts and palette as index.html */
  @font-face { font-family:"Archivo Black"; font-weight:100 900; font-display:swap; src:url(fonts/ArchivoBlack-Regular.woff2) format("woff2"); }
  @font-face { font-family:Vazirmatn; font-weight:400; font-display:swap; src:url(fonts/Vazirmatn-Regular.woff2) format("woff2"); }
  @font-face { font-family:Vazirmatn; font-weight:700; font-display:swap; src:url(fonts/Vazirmatn-Bold.woff2) format("woff2"); }

  :root { --primary:#1b2a4a; --on-primary:#ffffff; --gold:#b98a1f; --ink:#161616; --paper:#fffdf8; --page:#f1ede3; --muted:#6b665c; --line:#d6cfbf; --card:#f7f3ea; }
  @media (prefers-color-scheme: dark) {
    :root { --primary:#d9ae45; --on-primary:#17140d; --gold:#d9ae45; --ink:#f1ede4; --paper:#1c2030; --page:#12141c; --muted:#a7a99f; --line:#3a4052; --card:#232838; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:12px; background:var(--page); color:var(--ink); font-family:"Segoe UI", Tahoma, Arial, sans-serif; }
  body.fa { font-family:Vazirmatn, Tahoma, sans-serif; }
  .container { max-width:760px; margin:0 auto; padding:18px; background:var(--paper); border-radius:12px; box-shadow:0 2px 14px rgba(0,0,0,.1); }
  h2 { margin:6px 0 10px; text-align:center; font:400 26px/1.3 "Archivo Black", Impact, sans-serif; }
  body.fa h2 { font:700 24px/1.5 Vazirmatn, Tahoma, sans-serif; }
  h2::after { content:""; display:block; margin:10px auto 0; max-width:560px; height:5px; border-top:2px solid var(--gold); border-bottom:1px solid var(--gold); }
  :focus-visible { outline:3px solid #f5a623; outline-offset:2px; }

  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .back { display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border:2px solid var(--primary); border-radius:8px; color:var(--primary); font-weight:700; font-size:14px; text-decoration:none; }
  .mini { height:38px; width:auto; }
  button { font:inherit; cursor:pointer; }
  .langbtn { padding:6px 14px; font-size:14px; font-weight:700; border:2px solid var(--primary); border-radius:8px; background:transparent; color:var(--primary); }

  .steps { display:flex; gap:8px; margin:4px 0 14px; padding:0; list-style:none; counter-reset:s; }
  .steps li { flex:1; display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; background:var(--card); font-size:13px; line-height:1.4; counter-increment:s; }
  .steps li::before { content:counter(s); flex:none; display:grid; place-items:center; width:24px; height:24px; border-radius:50%; background:var(--primary); color:var(--on-primary); font-weight:700; font-size:13px; }
  body.fa .steps li::before { content:counter(s, persian); }
  @media (max-width:480px) { .steps { gap:6px; } .steps li { flex-direction:column; gap:4px; padding:8px 6px; text-align:center; font-size:12px; } }

  .filters { position:sticky; top:0; z-index:2; margin:0 -18px; padding:10px 18px; background:var(--paper); border-bottom:1px solid var(--line); }
  input[type=search] { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:16px; background:transparent; color:inherit; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  @media (max-width:600px) {
    /* one row that scrolls sideways, so the sticky bar stays short on phones */
    .chips { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; -webkit-mask-image:linear-gradient(to var(--end), #000 85%, transparent); mask-image:linear-gradient(to var(--end), #000 85%, transparent); }
    .chips::-webkit-scrollbar { display:none; }
  }
  :root { --end:right; } [dir=rtl] { --end:left; }
  .chip { flex:none; padding:7px 14px; border:1.5px solid var(--line); border-radius:999px; background:transparent; color:inherit; font-size:14px; white-space:nowrap; }
  .chip .n { color:var(--muted); font-size:12px; margin-inline-start:4px; }
  .chip[aria-pressed=true] { background:var(--primary); border-color:var(--primary); color:var(--on-primary); font-weight:700; }
  .chip[aria-pressed=true] .n { color:inherit; opacity:.8; }

  .group h3 { display:flex; align-items:baseline; gap:8px; margin:22px 0 10px; font-size:18px; }
  .group h3 .n { font-size:13px; font-weight:400; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
  @media (max-width:380px) { .grid { grid-template-columns:1fr 1fr; gap:10px; } }
  .card { display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--line); border-radius:10px; background:var(--card); color:inherit; text-decoration:none; transition:border-color .15s, transform .15s; }
  .card:hover { border-color:var(--gold); transform:translateY(-2px); }
  .card img { display:block; width:100%; height:auto; aspect-ratio:3/4; object-fit:cover; background:var(--line); }
  .card .info { display:flex; flex-direction:column; gap:2px; flex:1; padding:8px 10px 10px; }
  .card .name { font-weight:700; font-size:15px; line-height:1.4; }
  .card .latin { direction:ltr; font-size:12px; color:var(--muted); }
  body.fa .card .latin { text-align:right; }
  .card .go { margin-top:auto; padding-top:6px; font-size:13px; font-weight:700; color:var(--primary); }
  .status { margin:28px 0; text-align:center; color:var(--muted); line-height:1.8; }
  [hidden] { display:none !important; }
</style>
</head>
<body class="fa">
<div class="container">
  <div class="top">
    <a class="back" id="backLink" href="index.html" data-i18n="back"></a>
    <img class="mini" src="Lion_and_Sun.png" alt="" onerror="this.hidden=true">
    <button id="langBtn" class="langbtn" type="button"></button>
  </div>
  <h2 data-i18n="title"></h2>
  <ol class="steps">
    <li data-i18n="step1"></li>
    <li data-i18n="step2"></li>
    <li data-i18n="step3"></li>
  </ol>

  <div class="filters" id="filters" hidden>
    <input type="search" id="search" autocomplete="off" spellcheck="false" data-i18n-ph="searchPh" data-i18n-aria="searchPh">
    <div class="chips" id="chips" role="group" data-i18n-aria="cityLabel"></div>
  </div>
  <div id="results"></div>
  <p class="status" id="status" data-i18n="loading"></p>
</div>

<script>
const $ = id => document.getElementById(id);
const STR = {
  en: {
    title: 'Choose a Javidnam', back: '← Back',
    step1: 'Pick a city or search', step2: 'Tap a photo', step3: 'The poster is ready to print',
    searchPh: 'Search by name', cityLabel: 'Filter by city', all: 'All',
    people: n => n === 1 ? '1 person' : `${n} people`, make: 'Make poster →',
    loading: 'Loading the list…', empty: 'The list is being prepared. You can still make a poster with your own photo.',
    noMatch: 'No name matches your search.', failed: 'The list could not be loaded. Check your connection and reload the page.',
    otherLang: 'فارسی'
  },
  fa: {
    title: 'فهرست جاویدنامان', back: '→ بازگشت به پوستر‌ساز',
    step1: 'شهر را انتخاب یا نام را جستجو کنید', step2: 'روی عکس بزنید', step3: 'پوستر آماده‌ی چاپ است',
    searchPh: 'جستجوی نام', cityLabel: 'انتخاب شهر', all: 'همه',
    people: n => `${n.toLocaleString('fa')} نفر`, make: 'ساخت پوستر ←',
    loading: 'در حال بارگذاری فهرست…', empty: 'فهرست در حال آماده شدن است. همچنان می‌توانید با عکس خودتان پوستر بسازید.',
    noMatch: 'نامی با این جستجو پیدا نشد.', failed: 'فهرست بارگذاری نشد. اتصال اینترنت را بررسی کنید و صفحه را دوباره باز کنید.',
    otherLang: 'English'
  }
};

const params = new URLSearchParams(location.search);
let lang = params.get('lang');
if (lang !== 'en' && lang !== 'fa') { try { lang = localStorage.getItem('lang'); } catch (e) {} }
if (lang !== 'en' && lang !== 'fa') lang = /^fa/i.test(navigator.language) ? 'fa' : 'en';
const t = k => STR[lang][k];

let people = null, city = '', status = 'loading';

// Persian and Arabic letter forms, ZWNJ and case are ignored when searching
const fold = s => s.toLowerCase().replace(/[‌ً-ٟ]/g, '').replace(/[يى]/g, 'ی').replace(/ك/g, 'ک').replace(/\s+/g, ' ').trim();
const nameOf = p => lang === 'fa' ? p.name_fa : p.name;
const cityOf = p => lang === 'fa' ? p.city_fa : p.city;
const posterURL = p => `index.html?lang=${lang}&p=${encodeURIComponent(p.id)}`;

function el(tag, props, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids.filter(k => k != null));
  return e;
}
const count = n => el('span', { className: 'n', textContent: t('people')(n) });

function cities() {
  const m = new Map();
  people.forEach(p => m.set(p.city, (m.get(p.city) || 0) + 1));
  return [...m].map(([key, n]) => ({ key, n, label: cityOf(people.find(p => p.city === key)) }))
    .sort((a, b) => a.label.localeCompare(b.label, lang));
}

function renderChips() {
  const chip = (key, label, n) => {
    const b = el('button', { type: 'button', className: 'chip' }, label, el('span', { className: 'n', textContent: n.toLocaleString(lang) }));
    b.setAttribute('aria-pressed', String(city === key));
    b.addEventListener('click', () => { city = key; renderChips(); renderResults(); });
    return b;
  };
  $('chips').replaceChildren(chip('', t('all'), people.length), ...cities().map(c => chip(c.key, c.label, c.n)));
  const on = $('chips').querySelector('[aria-pressed=true]');
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function card(p) {
  const img = el('img', { src: `javidnam/thumbs/${p.id}.jpg`, alt: '', loading: 'lazy', decoding: 'async', width: 360, height: 480 });
  return el('a', { className: 'card', href: posterURL(p) }, img,
    el('span', { className: 'info' },
      el('span', { className: 'name', textContent: nameOf(p) }),
      lang === 'fa' ? el('span', { className: 'latin', textContent: p.name }) : null,
      el('span', { className: 'go', textContent: t('make') })));
}

function renderResults() {
  const q = fold($('search').value);
  const match = people.filter(p => (!city || p.city === city) && (!q || fold(p.name).includes(q) || fold(p.name_fa).includes(q)));
  const groups = cities().map(c => ({ ...c, list: match.filter(p => p.city === c.key) })).filter(g => g.list.length);
  $('results').replaceChildren(...groups.map(g =>
    el('section', { className: 'group' }, el('h3', {}, g.label, count(g.list.length)), el('div', { className: 'grid' }, ...g.list.map(card)))));
  $('status').hidden = match.length > 0;
  if (!match.length) $('status').textContent = t('noMatch');
}

function render() {
  $('filters').hidden = !(people && people.length);
  if (status !== 'ready') { $('results').replaceChildren(); $('status').hidden = false; $('status').textContent = t(status); return; }
  renderChips(); renderResults();
}

function applyLang(l) {
  lang = l;
  try { localStorage.setItem('lang', l); } catch (e) {}
  const d = document.documentElement;
  d.lang = l; d.dir = l === 'fa' ? 'rtl' : 'ltr';
  document.body.classList.toggle('fa', l === 'fa');
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(e => { e.placeholder = t(e.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach(e => { e.setAttribute('aria-label', t(e.dataset.i18nAria)); });
  $('langBtn').textContent = t('otherLang');
  $('backLink').href = `index.html?lang=${l}`;
  if (people) render();
}
$('langBtn').addEventListener('click', () => applyLang(lang === 'fa' ? 'en' : 'fa'));
$('search').addEventListener('input', () => { if (people) renderResults(); });
applyLang(lang);

fetch('javidnam/people.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(list => { people = list; status = list.length ? 'ready' : 'empty'; render(); })
  .catch(() => { people = []; status = 'failed'; render(); });
</script>
</body>
</html>
