<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javidnam Poster Maker</title>
    <!-- jsPDF library for high quality PDF output -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #f4f4f9;
            text-align: center;
            padding: 10px;
            margin: 0;
            box-sizing: border-box;
        }
        .container {
            background: #fff;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .form-group {
            margin: 15px 0;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            padding: 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            min-width: 130px;
        }
        button:hover {
            background: #0056b3;
        }
        button.pdf-btn {
            background: #28a745;
        }
        button.pdf-btn:hover {
            background: #218838;
        }
        button.reset-btn {
            background: #6c757d;
        }
        button.reset-btn:hover {
            background: #5a6268;
        }
        .canvas-container {
            position: relative;
            margin-top: 15px;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            cursor: grab;
            touch-action: none;
        }
        canvas:active {
            cursor: grabbing;
        }
        .hint {
            font-size: 13px;
            color: #666;
            margin-top: 6px;
        }

        @media (max-width: 480px) {
            body {
                padding: 5px;
            }
            .container {
                padding: 10px;
                border-radius: 8px;
            }
            .btn-group {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Javidnam Poster Maker</h2>
    
    <div class="form-group">
        <label>Javidnam Portrait Image (Upload or Drag & Drop):</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>
    
    <div class="form-group">
        <label>Javidnam Full Name:</label>
        <input type="text" id="nameInput" placeholder="Full Name">
    </div>

    <div class="btn-group">
        <button onclick="downloadJPG()">Download JPG</button>
        <button class="pdf-btn" onclick="downloadPDF()">Download Print PDF</button>
        <button class="reset-btn" onclick="resetForm()">Reset</button>
    </div>

    <h3>Live Preview</h3>
    <div class="canvas-container">
        <canvas id="posterCanvas"></canvas>
    </div>
    <div class="hint">You can drag the preview image to adjust the portrait position.</div>
</div>

<script>
    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');

    const posterTemplate = new Image();
    posterTemplate.src = 'Template.jpg';

    let userImage = null;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    posterTemplate.onload = () => {
        canvas.width = posterTemplate.naturalWidth;
        canvas.height = posterTemplate.naturalHeight;
        drawPoster();
    };

    function handleFile(file) {
        if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(event) {
                userImage = new Image();
                userImage.onload = function() {
                    panX = 0;
                    panY = 0;
                    drawPoster();
                };
                userImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    document.getElementById('imageInput').addEventListener('change', (e) => handleFile(e.target.files[0]));

    const container = document.querySelector('.container');
    container.addEventListener('dragover', (e) => e.preventDefault());
    container.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    document.getElementById('nameInput').addEventListener('input', drawPoster);

    function getCanvasCoordinates(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scale = canvas.width / rect.width;
        return {
            x: (clientX - rect.left) * scale,
            y: (clientY - rect.top) * scale
        };
    }

    function startDrag(e) {
        if (!userImage) return;
        isDragging = true;
        const pos = getCanvasCoordinates(e);
        startX = pos.x - panX;
        startY = pos.y - panY;
    }

    function drag(e) {
        if (!isDragging || !userImage) return;
        e.preventDefault();
        const pos = getCanvasCoordinates(e);
        panX = pos.x - startX;
        panY = pos.y - startY;
        drawPoster();
    }

    function stopDrag() {
        isDragging = false;
    }

    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('mousemove', drag);
    window.addEventListener('mouseup', stopDrag);

    canvas.addEventListener('touchstart', startDrag, { passive: false });
    canvas.addEventListener('touchmove', drag, { passive: false });
    window.addEventListener('touchend', stopDrag);

    function drawPoster() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (posterTemplate.complete) {
            ctx.drawImage(posterTemplate, 0, 0);
        }

        if (userImage) {
            ctx.save();
            const boxW = 3600;
            const boxH = 3380;
            const boxX = (canvas.width - boxW) / 2;
            const boxY = 1150;

            ctx.beginPath();
            ctx.rect(boxX, boxY, boxW, boxH);
            ctx.clip();

            // محاسبه ابعاد تصویر در حالت Cover
            const imgRatio = userImage.naturalWidth / userImage.naturalHeight;
            const boxRatio = boxW / boxH;

            let renderW, renderH;
            if (imgRatio > boxRatio) {
                renderH = boxH;
                renderW = boxH * imgRatio;
            } else {
                renderW = boxW;
                renderH = boxW / imgRatio;
            }

            // مرکز تصویر ابتدایی
            let drawX = boxX + (boxW - renderW) / 2 + panX;
            let drawY = boxY + (boxH - renderH) / 2 + panY;

            // محدود کردن جابه‌جایی (Clamping) تا عکس هرگز خارج از کادر نشود
            if (renderW > boxW) {
                const minX = boxX + boxW - renderW;
                const maxX = boxX;
                if (drawX < minX) drawX = minX;
                if (drawX > maxX) drawX = maxX;
            } else {
                drawX = boxX;
            }

            if (renderH > boxH) {
                const minY = boxY + boxH - renderH;
                const maxY = boxY;
                if (drawY < minY) drawY = minY;
                if (drawY > maxY) drawY = maxY;
            } else {
                drawY = boxY;
            }

            ctx.drawImage(userImage, drawX, drawY, renderW, renderH);
            ctx.restore();
        }

        const nameText = document.getElementById('nameInput').value.trim();
        if (nameText) {
            let fontSize = 380;
            const maxWidth = 3400;

            ctx.textAlign = 'center';
            
            do {
                ctx.font = `bold ${fontSize}px Impact, "Arial Black", sans-serif`;
                if (ctx.measureText(nameText).width <= maxWidth || fontSize <= 120) {
                    break;
                }
                fontSize -= 5;
            } while (fontSize > 120);

            ctx.fillStyle = '#111111';
            ctx.fillText(nameText, canvas.width / 2, 4880);
        }
    }

    function downloadJPG() {
        const link = document.createElement('a');
        link.download = 'poster.jpg';
        link.href = canvas.toDataURL('image/jpeg', 0.9);
        link.click();
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
            orientation: canvas.width > canvas.height ? 'landscape' : 'portrait',
            unit: 'px',
            format: [canvas.width, canvas.height]
        });
        
        const imgData = canvas.toDataURL('image/jpeg', 0.9);
        pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
        pdf.save('poster.pdf');
    }

    function resetForm() {
        userImage = null;
        panX = 0;
        panY = 0;
        document.getElementById('imageInput').value = '';
        document.getElementById('nameInput').value = '';
        drawPoster();
    }
</script>

</body>
</html>
