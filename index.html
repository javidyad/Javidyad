<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javidnam Poster Maker</title>
    <!-- کتابخانه jsPDF برای دانلود فایل PDF باکیفیت چاپ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #f4f4f9;
            text-align: center;
            padding: 10px;
            margin: 0;
            box-sizing: border-box;
        }
        .container {
            background: #fff;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .form-group {
            margin: 15px 0;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background: #0056b3;
        }
        button.pdf-btn {
            background: #28a745;
        }
        button.pdf-btn:hover {
            background: #218838;
        }
        canvas {
            max-width: 100%;
            height: auto;
            margin-top: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* ریسپانسیو برای گوشی‌های موبایل */
        @media (max-width: 480px) {
            body {
                padding: 5px;
            }
            .container {
                padding: 10px;
                border-radius: 8px;
            }
            .btn-group {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Javidnam Poster Maker</h2>
    
    <div class="form-group">
        <label>Javidnam Portrait Image:</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>
    
    <div class="form-group">
        <label>Javidnam Full Name:</label>
        <input type="text" id="nameInput" placeholder="Full Name">
    </div>

    <div class="btn-group">
        <button onclick="downloadJPG()">Download JPG</button>
        <button class="pdf-btn" onclick="downloadPDF()">Download Print PDF</button>
    </div>

    <h3>Live Preview</h3>
    <canvas id="posterCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');

    const posterTemplate = new Image();
    posterTemplate.src = 'Template.jpg';

    let userImage = null;

    posterTemplate.onload = () => {
        canvas.width = posterTemplate.naturalWidth;
        canvas.height = posterTemplate.naturalHeight;
        drawPoster();
    };

    document.getElementById('imageInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                userImage = new Image();
                userImage.onload = function() {
                    drawPoster();
                }
                userImage.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('nameInput').addEventListener('input', function() {
        drawPoster();
    });

    function drawPoster() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (posterTemplate.complete) {
            ctx.drawImage(posterTemplate, 0, 0);
        }

        if (userImage) {
            ctx.save();
            const boxW = 3600;
            const boxH = 3380;
            const boxX = (canvas.width - boxW) / 2;
            const boxY = 1150;

            ctx.beginPath();
            ctx.rect(boxX, boxY, boxW, boxH);
            ctx.clip();

            const imgRatio = userImage.naturalWidth / userImage.naturalHeight;
            const boxRatio = boxW / boxH;
            let sWidth = userImage.naturalWidth;
            let sHeight = userImage.naturalHeight;
            let sX = 0;
            let sY = 0;

            if (imgRatio > boxRatio) {
                sWidth = userImage.naturalHeight * boxRatio;
                sX = (userImage.naturalWidth - sWidth) / 2;
            } else {
                sHeight = userImage.naturalWidth / boxRatio;
                sY = (userImage.naturalHeight - sHeight) / 2;
            }

            ctx.drawImage(userImage, sX, sY, sWidth, sHeight, boxX, boxY, boxW, boxH);
            ctx.restore();
        }

        // سیستم تنظیم خودکار سایز فونت (Auto-fit) برای پر کردن حداکثری عرض کادر
        const nameText = document.getElementById('nameInput').value.trim();
        if (nameText) {
            let fontSize = 380;
            const maxWidth = 3400;

            ctx.textAlign = 'center';
            
            do {
                ctx.font = `bold ${fontSize}px Impact, "Arial Black", sans-serif`;
                if (ctx.measureText(nameText).width <= maxWidth || fontSize <= 120) {
                    break;
                }
                fontSize -= 5;
            } while (fontSize > 120);

            ctx.fillStyle = '#111111';
            ctx.fillText(nameText, canvas.width / 2, 4880);
        }
    }

    function downloadJPG() {
        const link = document.createElement('a');
        link.download = 'poster.jpg';
        link.href = canvas.toDataURL('image/jpeg', 0.9);
        link.click();
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
            orientation: canvas.width > canvas.height ? 'landscape' : 'portrait',
            unit: 'px',
            format: [canvas.width, canvas.height]
        });
        
        const imgData = canvas.toDataURL('image/jpeg', 0.9);
        pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
        pdf.save('poster.pdf');
    }
</script>

</body>
</html>
