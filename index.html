<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Javidnam Poster Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root { --bg:#f4f4f9; --card:#fff; --text:#222; --muted:#666; --line:#ccc; --blue:#0b6bdc; --green:#1c8a3a; --grey:#5b636b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17181c; --card:#23252b; --text:#eee; --muted:#a0a4ab; --line:#464a52; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:10px; background:var(--bg); color:var(--text); font-family:"Segoe UI", Tahoma, Arial, sans-serif; }
  .container { max-width:640px; margin:0 auto; padding:16px; background:var(--card); border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,.1); transition:outline-color .15s; outline:3px dashed transparent; }
  .container.dragover { outline-color:var(--blue); }
  h2 { text-align:center; margin:4px 0 12px; }
  label { display:block; margin:14px 0 5px; font-weight:bold; font-size:14px; }
  input[type=file], input[type=text] { width:100%; padding:11px; border:1px solid var(--line); border-radius:6px; font-size:16px; background:transparent; color:inherit; font-family:inherit; }
  .zoom-row { display:flex; align-items:center; gap:10px; }
  .zoom-row input { flex:1; }
  .btns { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  button { flex:1; min-width:130px; padding:13px; border:0; border-radius:6px; color:#fff; font-size:16px; font-weight:bold; font-family:inherit; cursor:pointer; background:var(--blue); }
  button.pdf { background:var(--green); }
  button.reset { background:var(--grey); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button:focus-visible, input:focus-visible { outline:3px solid #f5a623; outline-offset:2px; }
  .stage { margin-top:16px; text-align:center; }
  canvas { width:100%; height:auto; border:1px solid var(--line); border-radius:6px; touch-action:none; cursor:grab; background:#fff; }
  canvas.dragging { cursor:grabbing; }
  .note { font-size:13px; color:var(--muted); margin-top:6px; }
  .warn { margin-top:8px; padding:8px 10px; border-radius:6px; background:#fff3cd; color:#5c4400; font-size:13px; }
  .error { margin-top:8px; padding:8px 10px; border-radius:6px; background:#fde2e2; color:#7a1212; font-size:13px; }
  body.fa { font-family:Vazirmatn, Tahoma, sans-serif; }
  .top { text-align:end; }
  button.langbtn { flex:none; min-width:0; width:auto; padding:6px 14px; font-size:14px; background:var(--grey); }
  body.lang-pick { min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; }
  body.lang-pick .container { width:100%; }
  .emblem { display:block; width:160px; max-width:50%; height:auto; margin:8px auto 4px; }
  .lang-q { text-align:center; line-height:1.9; margin:6px 0 4px; color:var(--muted); }
  .zoom-row { direction:ltr; }
  .privacy { font-size:13px; color:var(--muted); margin-top:6px; line-height:1.7; }
  .info { margin-top:8px; padding:8px 10px; border-radius:6px; background:#dbeafe; color:#0b3a7a; font-size:13px; }
  button.primary { flex:1 1 100%; }
  [hidden] { display:none !important; }
  @media (max-width:480px) { .btns button { width:100%; } }
</style>
</head>
<body class="lang-pick">
<div class="container" id="langScreen">
  <img class="emblem" src="Lion_and_Sun.png" alt="Lion and Sun" onerror="this.hidden=true">
  <h2>Javidnam Poster Maker</h2>
  <p class="lang-q">Choose your language<br>زبان خود را انتخاب کنید</p>
  <div class="btns">
    <button data-lang="en" dir="ltr">English</button>
    <button data-lang="fa">فارسی</button>
  </div>
</div>

<div class="container" id="container" hidden>
  <div class="top"><button id="langBtn" class="langbtn" type="button"></button></div>
  <h2 data-i18n="title"></h2>

  <label for="imageInput" data-i18n="photoLabel"></label>
  <input type="file" id="imageInput" accept="image/*">
  <div class="privacy" data-i18n="privacy"></div>
  <div class="warn" id="lowRes" data-i18n="lowRes" hidden></div>

  <label for="nameInput" data-i18n="nameLabel"></label>
  <input type="text" id="nameInput" dir="ltr" autocapitalize="words" autocomplete="off" spellcheck="false" data-i18n-ph="namePh">

  <label for="zoomInput" data-i18n="zoomLabel"></label>
  <div class="zoom-row">
    <input type="range" id="zoomInput" min="1" max="3" step="0.01" value="1" disabled>
    <span id="zoomLabel">100%</span>
  </div>

  <div class="btns">
    <button id="saveBtn" class="primary" data-i18n="save" disabled></button>
    <button id="jpgBtn" data-i18n="jpg" disabled></button>
    <button id="pdfBtn" class="pdf" data-i18n="pdf" disabled></button>
    <button id="resetBtn" class="reset" data-i18n="reset"></button>
  </div>
  <div class="privacy" data-i18n="saveTip"></div>
  <div class="error" id="errorBox" hidden></div>

  <div class="stage" id="stage" hidden>
    <canvas id="posterCanvas" data-i18n-aria="previewAria"></canvas>
    <div class="note" data-i18n="hint"></div>
  </div>
</div>

<script>
/* ---------- Language ---------- */
const STR = {
  en: {
    title: 'Javidnam Poster Maker',
    photoLabel: 'Portrait image (choose a file or drag & drop anywhere on the page)',
    lowRes: 'This image has a low resolution and may look blurry in a large print. Use a larger version if you have one.',
    nameLabel: 'Enter the full name in English letters', namePh: 'Full Name', zoomLabel: 'Photo zoom',
    jpg: 'Download JPG', pdf: 'Download print PDF', reset: 'Reset',
    hint: 'Drag the photo in the preview to reposition it. Pinch with two fingers, or use the slider or mouse wheel, to zoom.',
    privacy: 'Your photo is processed only on your device. It is never uploaded or sent anywhere.',
    save: 'Save to gallery',
    saveTip: 'In the menu that opens, choose “Save Image” (iPhone) or Photos / Gallery (Android).',
    shareFallback: 'Your browser cannot open the share menu, so the image was downloaded instead.',
    nameLatin: 'Only English letters are allowed in the name.',
    previewAria: 'Poster preview', otherLang: 'فارسی',
    tplFail: 'Template.jpg could not be loaded. Make sure it is in the same folder as this HTML file and that the page is opened from a server or host, not via file://.',
    imgFail: 'This file could not be read as an image.',
    blobFail: 'Could not create the file. Please try again.',
    jpgFail: 'JPG export failed: ',
    pdfLib: 'The PDF library did not load. Check your internet connection.',
    pdfFail: 'PDF export failed: '
  },
  fa: {
    title: 'پوستر‌ساز جاویدنام',
    photoLabel: 'عکس پرتره (انتخاب فایل یا کشیدن و رها کردن روی صفحه)',
    lowRes: 'رزولوشن این عکس پایین است و در چاپ بزرگ کدر دیده می‌شود. اگر نسخه‌ی بزرگ‌تری دارید از آن استفاده کنید.',
    nameLabel: 'نام کامل را با حروف انگلیسی وارد کنید', namePh: 'Full Name', zoomLabel: 'زوم عکس',
    jpg: 'دانلود JPG', pdf: 'دانلود PDF چاپی', reset: 'پاک کردن',
    hint: 'عکس را روی پیش‌نمایش بکشید تا جابه‌جا شود. با دو انگشت (پینچ)، اسلایدر یا چرخ ماوس می‌توانید زوم کنید.',
    privacy: 'عکس شما فقط روی دستگاه خودتان پردازش می‌شود و به هیچ جا آپلود یا ارسال نمی‌شود.',
    save: 'ذخیره در گالری',
    saveTip: 'در منویی که باز می‌شود، «Save Image» (آیفون) یا Photos / Gallery (اندروید) را انتخاب کنید.',
    shareFallback: 'مرورگر شما منوی اشتراک‌گذاری را پشتیبانی نمی‌کند، به همین دلیل عکس دانلود شد.',
    nameLatin: 'در نام فقط حروف انگلیسی مجاز است.',
    previewAria: 'پیش‌نمایش پوستر', otherLang: 'English',
    tplFail: 'فایل Template.jpg بارگذاری نشد. مطمئن شوید کنار همین فایل HTML است و صفحه را از روی سرور یا هاست باز کرده‌اید، نه با file://.',
    imgFail: 'این فایل به‌عنوان عکس خوانده نشد.',
    blobFail: 'ساخت فایل ناموفق بود. دوباره امتحان کنید.',
    jpgFail: 'خطا در ساخت JPG: ',
    pdfLib: 'کتابخانه‌ی PDF بارگذاری نشد. اتصال اینترنت را بررسی کنید.',
    pdfFail: 'خطا در ساخت PDF: '
  }
};
let lang = 'en';
let lastError = null;
const t = k => STR[lang][k];

function renderError() {
  const b = document.getElementById('errorBox');
  if (lastError) { b.className = lastError.kind; b.textContent = t(lastError.key) + lastError.extra; b.hidden = false; }
  else b.hidden = true;
}
function showMsg(key, extra = '', kind = 'error') { lastError = key ? { key, extra, kind } : null; renderError(); }
function showError(key, extra = '') { showMsg(key, extra, 'error'); }

function applyLang(l) {
  lang = l;
  const d = document.documentElement;
  d.lang = l; d.dir = l === 'fa' ? 'rtl' : 'ltr';
  document.body.classList.toggle('fa', l === 'fa');
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  document.getElementById('langBtn').textContent = t('otherLang');
  renderError();
}
function chooseLang(l) {
  applyLang(l);
  document.body.classList.remove('lang-pick');
  document.getElementById('langScreen').hidden = true;
  document.getElementById('container').hidden = false;
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => chooseLang(b.dataset.lang)));
document.getElementById('langBtn').addEventListener('click', () => applyLang(lang === 'fa' ? 'en' : 'fa'));

/* ---------- Settings (coordinates are on the full-size template canvas) ---------- */
const CONFIG = {
  templateSrc: 'Template.jpg',
  photoBox: { w: 3600, h: 3200, y: 1150 },      // photo box; x is centered automatically
  nameZone: { top: 4350, bottom: 5075 },        // empty zone between the photo and the red line
  nameMaxWidth: 3400,
  nameMaxSize: 340,
  nameMinSize: 140,
  nameColor: '#111111',
  latinFont: '"Archivo Black", "Arial Black", Impact, sans-serif',
    previewWidth: 900,                            // preview canvas width in px
  shareMaxPixels: 9000000,                      // smaller export for the share sheet (renders fast, keeps the tap valid on iOS)
  maxExportPixels: 16000000,                    // safe pixel limit for iOS Safari
  lowResRatio: 0.5                              // warn if image width is below this fraction of the photo box
};

const $ = id => document.getElementById(id);
const canvas = $('posterCanvas'), ctx = canvas.getContext('2d');
const nameInput = $('nameInput'), zoomInput = $('zoomInput');

const template = new Image();
let templateReady = false;
let userImage = null, imageURL = null;
let zoom = 1, panX = 0, panY = 0;
let previewScale = 0.2;

/* ---------- Template loading ---------- */
template.onload = async () => {
  templateReady = true;
  previewScale = CONFIG.previewWidth / template.naturalWidth;
  canvas.width = Math.round(template.naturalWidth * previewScale);
  canvas.height = Math.round(template.naturalHeight * previewScale);
  await loadFonts();
  redraw();
};
template.onerror = () => showError('tplFail');
template.src = CONFIG.templateSrc;

async function loadFonts() {
  try {
    await document.fonts.load('900 300px "Archivo Black"');
  } catch (e) { /* fall back to system fonts */ }
}


/* ---------- User photo ---------- */
function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  if (imageURL) URL.revokeObjectURL(imageURL);
  imageURL = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    userImage = img; zoom = 1; panX = panY = 0;
    zoomInput.value = 1; zoomInput.disabled = false; updateZoomLabel();
    $('lowRes').hidden = img.naturalWidth >= CONFIG.photoBox.w * CONFIG.lowResRatio;
    redraw();
  };
  img.onerror = () => showError('imgFail');
  img.src = imageURL;
}
$('imageInput').addEventListener('change', e => handleFile(e.target.files[0]));

const container = $('container');
['dragenter', 'dragover'].forEach(t => container.addEventListener(t, e => { e.preventDefault(); container.classList.add('dragover'); }));
['dragleave', 'drop'].forEach(t => container.addEventListener(t, e => { e.preventDefault(); container.classList.remove('dragover'); }));
container.addEventListener('drop', e => { if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });

nameInput.addEventListener('input', e => {
  if (!e.isComposing) {
    const clean = nameInput.value.replace(/[^A-Za-z\s.'’-]/g, '');
    if (clean !== nameInput.value) { nameInput.value = clean; showMsg('nameLatin', '', 'warn'); }
    else if (lastError && lastError.key === 'nameLatin') showError('');
  }
  redraw();
});

/* ---------- Zoom and pan ---------- */
function updateZoomLabel() { $('zoomLabel').textContent = Math.round(zoom * 100) + '%'; }
function setZoom(z) {
  zoom = Math.min(3, Math.max(1, z));
  zoomInput.value = zoom; updateZoomLabel();
  clampPan(); redraw();
}
zoomInput.addEventListener('input', () => setZoom(parseFloat(zoomInput.value)));
canvas.addEventListener('wheel', e => {
  if (!userImage) return;
  e.preventDefault();
  setZoom(zoom * (e.deltaY < 0 ? 1.06 : 1 / 1.06));
}, { passive: false });

function imageSize() {
  const { w, h } = CONFIG.photoBox;
  const r = userImage.naturalWidth / userImage.naturalHeight;
  const base = r > w / h ? { w: h * r, h } : { w, h: w / r };
  return { w: base.w * zoom, h: base.h * zoom };
}
function clampPan() {
  if (!userImage) return;
  const { w, h } = CONFIG.photoBox, s = imageSize();
  const maxX = (s.w - w) / 2, maxY = (s.h - h) / 2;
  panX = Math.min(maxX, Math.max(-maxX, panX));
  panY = Math.min(maxY, Math.max(-maxY, panY));
}

const pointers = new Map();
let gesture = null;
function toDesign(p) {
  const rect = canvas.getBoundingClientRect();
  const k = template.naturalWidth / rect.width;
  return { x: (p.clientX - rect.left) * k, y: (p.clientY - rect.top) * k };
}
function pinchInfo(a, b) {
  return {
    dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1,
    mid: toDesign({ clientX: (a.clientX + b.clientX) / 2, clientY: (a.clientY + b.clientY) / 2 })
  };
}
function startGesture() {
  const pts = [...pointers.values()];
  if (pts.length === 1) {
    const d = toDesign(pts[0]);
    gesture = { type: 'pan', sx: d.x - panX, sy: d.y - panY };
  } else if (pts.length >= 2) {
    gesture = { type: 'pinch', zoom, panX, panY, ...pinchInfo(pts[0], pts[1]) };
  } else gesture = null;
}
canvas.addEventListener('pointerdown', e => {
  if (!userImage) return;
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });
  startGesture();
  canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', e => {
  if (!gesture || !pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });
  const pts = [...pointers.values()];
  if (gesture.type === 'pan' && pts.length === 1) {
    const p = toDesign(pts[0]);
    panX = p.x - gesture.sx; panY = p.y - gesture.sy;
  } else if (gesture.type === 'pinch' && pts.length >= 2) {
    const now = pinchInfo(pts[0], pts[1]);
    zoom = Math.min(3, Math.max(1, gesture.zoom * now.dist / gesture.dist));
    zoomInput.value = zoom; updateZoomLabel();
    panX = gesture.panX + (now.mid.x - gesture.mid.x);
    panY = gesture.panY + (now.mid.y - gesture.mid.y);
  } else return;
  clampPan(); redraw();
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  startGesture();
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

/* ---------- Drawing ---------- */
let raf = 0;
// the preview and export buttons appear only once there is a photo or a name
function updateState() {
  const has = !!userImage || nameInput.value.trim() !== '';
  $('stage').hidden = !has;
  ['saveBtn', 'jpgBtn', 'pdfBtn'].forEach(id => { $(id).disabled = !(templateReady && has); });
}
function redraw() {
  updateState();
  if (!templateReady) return;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => render(ctx, previewScale));
}

// choose the line break that makes both lines closest in width
function splitName(c, words) {
  let best = 1, bestDiff = Infinity;
  for (let i = 1; i < words.length; i++) {
    const d = Math.abs(c.measureText(words.slice(0, i).join(' ')).width - c.measureText(words.slice(i).join(' ')).width);
    if (d < bestDiff) { bestDiff = d; best = i; }
  }
  return [words.slice(0, best).join(' '), words.slice(best).join(' ')];
}

function drawName(c, W) {
  const text = nameInput.value.trim().replace(/\s+/g, ' ');
  if (!text) return;
  const fontAt = sz => `900 ${sz}px ${CONFIG.latinFont}`;
  const words = text.split(' ');

  c.fillStyle = CONFIG.nameColor;
  c.textAlign = 'center';
  c.textBaseline = 'alphabetic';
  c.direction = 'ltr';

  c.font = fontAt(CONFIG.nameMaxSize);
  const lines = words.length > 1 ? splitName(c, words) : [text];

  let size = CONFIG.nameMaxSize;
  while (size > CONFIG.nameMinSize) {
    c.font = fontAt(size);
    if (Math.max(...lines.map(l => c.measureText(l).width)) <= CONFIG.nameMaxWidth) break;
    size -= 5;
  }
  c.font = fontAt(size);

  const { top, bottom } = CONFIG.nameZone;
  const capH = size * 0.72, gap = size * 0.18;
  const blockH = capH * lines.length + gap * (lines.length - 1);
  let y = top + (bottom - top - blockH) / 2 + capH;
  lines.forEach(l => { c.fillText(l, W / 2, y); y += capH + gap; });
}

function render(c, scale) {
  const W = template.naturalWidth, H = template.naturalHeight;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, c.canvas.width, c.canvas.height);
  c.setTransform(scale, 0, 0, scale, 0, 0);
  c.drawImage(template, 0, 0, W, H);

  if (userImage) {
    const { w: bw, h: bh, y: by } = CONFIG.photoBox, bx = (W - bw) / 2;
    const s = imageSize();
    c.save();
    c.beginPath(); c.rect(bx, by, bw, bh); c.clip();
    c.imageSmoothingQuality = 'high';
    c.drawImage(userImage, bx + (bw - s.w) / 2 + panX, by + (bh - s.h) / 2 + panY, s.w, s.h);
    c.restore();
  }
  drawName(c, W);
}

/* ---------- Export ---------- */
function renderFull(limit = CONFIG.maxExportPixels) {
  const W = template.naturalWidth, H = template.naturalHeight;
  const k = Math.min(1, Math.sqrt(limit / (W * H)));
  const off = document.createElement('canvas');
  off.width = Math.round(W * k); off.height = Math.round(H * k);
  render(off.getContext('2d'), k);
  return off;
}
function fileBase() {
  const n = nameInput.value.trim().replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '-');
  return 'poster-' + (n || 'javidnam');
}

function makeJpegBlob(limit) {
  return new Promise((resolve, reject) => {
    try { renderFull(limit).toBlob(b => (b ? resolve(b) : reject(new Error('empty'))), 'image/jpeg', 0.95); }
    catch (e) { reject(e); }
  });
}
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

$('saveBtn').addEventListener('click', async () => {
  showError('');
  try {
    const blob = await makeJpegBlob(CONFIG.shareMaxPixels);
    const file = new File([blob], fileBase() + '.jpg', { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    downloadBlob(blob, file.name);
    showMsg('shareFallback', '', 'info');
  } catch (e) { showError('jpgFail', e.message); }
});

$('jpgBtn').addEventListener('click', async () => {
  showError('');
  try { downloadBlob(await makeJpegBlob(), fileBase() + '.jpg'); }
  catch (e) { showError('jpgFail', e.message); }
});

$('pdfBtn').addEventListener('click', () => {
  showError('');
  if (!window.jspdf) return showError('pdfLib');
  try {
    const off = renderFull();
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a3', orientation: 'portrait' });
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
    let w = pw, h = pw * off.height / off.width;
    if (h > ph) { h = ph; w = ph * off.width / off.height; }
    pdf.addImage(off.toDataURL('image/jpeg', 0.95), 'JPEG', (pw - w) / 2, (ph - h) / 2, w, h, undefined, 'FAST');
    pdf.save(fileBase() + '.pdf');
  } catch (e) { showError('pdfFail', e.message); }
});

$('resetBtn').addEventListener('click', () => {
  if (imageURL) URL.revokeObjectURL(imageURL);
  imageURL = userImage = null;
  zoom = 1; panX = panY = 0;
  zoomInput.value = 1; zoomInput.disabled = true; updateZoomLabel();
  $('imageInput').value = ''; nameInput.value = '';
  $('lowRes').hidden = true; showError('');
  redraw();
});
</script>
</body>
</html>
