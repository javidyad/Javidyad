<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سازنده آنلاین پوستر</title>
    <!-- کتابخانه jsPDF برای دانلود فایل PDF باکیفیت چاپ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #f4f4f9;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: #fff;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .form-group {
            margin: 15px 0;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background: #0056b3;
        }
        button.pdf-btn {
            background: #28a745;
        }
        button.pdf-btn:hover {
            background: #218838;
        }
        canvas {
            max-width: 100%;
            height: auto;
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ساخت پوستر اختصاصی</h2>
    
    <div class="form-group">
        <label>انتخاب عکس جاویدنام:</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>
    
    <div class="form-group">
        <label>نام و نام خانوادگی جاویدنام:</label>
        <input type="text" id="nameInput" placeholder="نام و نام خانوادگی">
    </div>

    <div class="btn-group">
        <button onclick="downloadPNG()">دانلود تصویر (PNG)</button>
        <button class="pdf-btn" onclick="downloadPDF()">دانلود فایل چاپی (PDF)</button>
    </div>

    <h3>پیش‌نمایش زنده</h3>
    <canvas id="posterCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');

    const posterTemplate = new Image();
    posterTemplate.src = 'Template.jpg';

    let userImage = null;

    posterTemplate.onload = () => {
        canvas.width = posterTemplate.naturalWidth;
        canvas.height = posterTemplate.naturalHeight;
        drawPoster();
    };

    document.getElementById('imageInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                userImage = new Image();
                userImage.onload = function() {
                    drawPoster();
                }
                userImage.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('nameInput').addEventListener('input', function() {
        drawPoster();
    });

    function drawPoster() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (posterTemplate.complete) {
            ctx.drawImage(posterTemplate, 0, 0);
        }

        // همان اندازه و موقعیت قبلی و ایده‌آل عکس
        if (userImage) {
            ctx.save();
            const boxW = 3600;
            const boxH = 3200;
            const boxX = (canvas.width - boxW) / 2;
            const boxY = 1150;

            ctx.beginPath();
            ctx.rect(boxX, boxY, boxW, boxH);
            ctx.clip();

            const imgRatio = userImage.naturalWidth / userImage.naturalHeight;
            const boxRatio = boxW / boxH;
            let sWidth = userImage.naturalWidth;
            let sHeight = userImage.naturalHeight;
            let sX = 0;
            let sY = 0;

            if (imgRatio > boxRatio) {
                sWidth = userImage.naturalHeight * boxRatio;
                sX = (userImage.naturalWidth - sWidth) / 2;
            } else {
                sHeight = userImage.naturalWidth / boxRatio;
                sY = (userImage.naturalHeight - sHeight) / 2;
            }

            ctx.drawImage(userImage, sX, sY, sWidth, sHeight, boxX, boxY, boxW, boxH);
            ctx.restore();
        }

        // متن دو سطری بزرگ، اما ۱۰ درصد کوچک‌تر شده برای نشستن دقیق در فضای خالی بدون تداخل
        const nameText = document.getElementById('nameInput').value.trim();
        if (nameText) {
            ctx.font = 'bold 320px Tahoma, sans-serif';
            ctx.fillStyle = '#111111';
            ctx.textAlign = 'center';

            const words = nameText.split(' ');
            if (words.length > 1) {
                const mid = Math.ceil(words.length / 2);
                const line1 = words.slice(0, mid).join(' ');
                const line2 = words.slice(mid).join(' ');

                ctx.fillText(line1, canvas.width / 2, 4580);
                ctx.fillText(line2, canvas.width / 2, 4960);
            } else {
                ctx.fillText(nameText, canvas.width / 2, 4770);
            }
        }
    }

    function downloadPNG() {
        const link = document.createElement('a');
        link.download = 'poster.png';
        link.href = canvas.toDataURL('image/png', 1.0);
        link.click();
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
            orientation: canvas.width > canvas.height ? 'landscape' : 'portrait',
            unit: 'px',
            format: [canvas.width, canvas.height]
        });
        
        const imgData = canvas.toDataURL('image/png', 1.0);
        pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
        pdf.save('poster.pdf');
    }
</script>

</body>
</html>
